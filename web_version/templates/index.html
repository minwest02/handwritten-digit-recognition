<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Created: 2026-09-29 22:52:45 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwritten Digit Recognition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .canvas-container {
            margin-bottom: 20px;
            display: inline-block;
            border: 2px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
        }

        canvas {
            display: block;
            cursor: crosshair;
            background-color: white;
        }

        .button-group {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .clear-btn {
            background-color: #ff6b6b;
            color: white;
        }

        .clear-btn:hover {
            background-color: #ff5252;
            transform: scale(1.05);
        }

        .recognize-btn {
            background-color: #51cf66;
            color: white;
        }

        .recognize-btn:hover {
            background-color: #40c057;
            transform: scale(1.05);
        }

        .results {
            margin-top: 30px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 5px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .prediction-label {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .confidence-label {
            font-size: 18px;
            color: #666;
        }

        .error-message {
            color: #d32f2f;
            font-size: 16px;
        }

        .loading {
            color: #667eea;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Handwritten Digit Recognition</h1>

        <div class="canvas-container">
            <canvas id="drawingCanvas" width="280" height="280"></canvas>
        </div>

        <div class="button-group">
            <button class="clear-btn" onclick="clearCanvas()">Clear</button>
            <button class="recognize-btn" onclick="recognize()">Recognize</button>
        </div>

        <div class="results">
            <div class="prediction-label" id="predictionLabel">Predicted: -</div>
            <div class="confidence-label" id="confidenceLabel">Confidence: -</div>
        </div>
    </div>

    <script>
        // Created: 2026-09-29 22:52:45

        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        const predictionLabel = document.getElementById('predictionLabel');
        const confidenceLabel = document.getElementById('confidenceLabel');

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // Initialize canvas with white background
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Mouse events for drawing
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Draw line from last position to current position
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();

            lastX = x;
            lastY = y;
        });

        canvas.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        canvas.addEventListener('mouseleave', () => {
            isDrawing = false;
        });

        function clearCanvas() {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            predictionLabel.textContent = 'Predicted: -';
            confidenceLabel.textContent = 'Confidence: -';
        }

        function recognize() {
            // Convert canvas to grayscale image data
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            // Convert RGBA to grayscale
            const grayscale = new Uint8ClampedArray(canvas.width * canvas.height);
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                grayscale[i / 4] = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
            }

            // Convert to base64
            const imageBase64 = btoa(String.fromCharCode.apply(null, grayscale));

            // Show loading state
            predictionLabel.textContent = 'Predicting...';
            confidenceLabel.textContent = '';

            // Send to server
            fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    image: imageBase64,
                    width: canvas.width,
                    height: canvas.height
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    predictionLabel.textContent = 'Error';
                    confidenceLabel.textContent = data.error;
                    confidenceLabel.className = 'confidence-label error-message';
                } else {
                    predictionLabel.textContent = `Predicted: ${data.digit}`;
                    confidenceLabel.textContent = `Confidence: ${(data.confidence * 100).toFixed(1)}%`;
                    confidenceLabel.className = 'confidence-label';
                }
            })
            .catch(error => {
                predictionLabel.textContent = 'Error';
                confidenceLabel.textContent = 'Failed to connect to server';
                confidenceLabel.className = 'confidence-label error-message';
                console.error('Error:', error);
            });
        }
    </script>
</body>
</html>
